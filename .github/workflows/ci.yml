name: pipeline-and-contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pipeline
        run: python -m pip install -e ".[dev]"
      - name: Test pipeline and workflow
        run: python -m pytest python_tests -q
      - name: Lint pipeline and workflow
        run: ruff check resolvesignal_pipeline python_tests examples scripts

  integration-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install standalone kit
        run: python -m pip install -e "toolkits/python[dev]"
      - name: Offline client tests
        run: python -m pytest toolkits/python/tests -q
      - name: Build versioned kit and verify source hashes
        run: python scripts/build_integration_kit.py --output /tmp/resolvesignal-kit

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
